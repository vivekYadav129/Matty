# ========================
# Server
# ========================
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ========================
# MongoDB
# ========================
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/matty}}
spring.data.mongodb.database=${MONGODB_DATABASE:matty}
spring.data.mongodb.auto-index-creation=true

# ========================
# JWT
# ========================
jwt.secret=${JWT_SECRET:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNA==}
