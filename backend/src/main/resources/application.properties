# ========================
# Cloudinary
# ========================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dujjdtial}
cloudinary.api-key=${CLOUDINARY_API_KEY:218761639438599}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:EOBrVRhC44NU1ctnFkrmvE6uzX8}

# ========================
# File Upload
# ========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================
# CORS & OAuth Redirects
# ========================
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://matty-design-tau.vercel.app}
app.oauth2.authorized-redirect-uri=${APP_OAUTH2_AUTHORIZED_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

# ========================
# OAuth 2.0 Credentials (Set via environment variables)
# ========================
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth2.github.client-secret=${GITHUB_CLIENT_SECRET:}
