services:
  - type: web
    name: matty-backend
    runtime: java
    rootDir: backend
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/*.jar"

    envVars:
      - key: PORT
        value: 8080

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false